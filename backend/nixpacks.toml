# deepface pins `opencv-python` (the full, Qt/X11-linked build) as its own
# dependency, so pip installs it after opencv-python-headless. Both ship the
# same `cv2/` directory, so the GUI build's binary overwrites the headless
# one and import fails on missing libxcb -- this image has no X11.
#
# Uninstalling the GUI build alone isn't enough: it deletes the shared binary
# that headless also owns, leaving headless's metadata pointing at files that
# are gone. Remove both, then reinstall headless so `cv2/` is coherent.
[phases.stripGuiOpencv]
dependsOn = ["install"]
cmds = [
  ". /opt/venv/bin/activate && pip uninstall -y opencv-python opencv-python-headless && pip install --no-cache-dir opencv-python-headless",
]
